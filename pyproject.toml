[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[project]
name = "fastapi-typed-client"
version = "0.6.0"
authors = [
    { name = "Lukas Schmelzeisen", email = "me@lschmelzeisen.com" }
]
description = "Generate a fully-typed client for your FastAPI app with the Pydantic models from your code (mostly for testing)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["fastapi", "client", "testing", "typed", "httpx", "pydantic", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AnyIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-mock>=3.16.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16.10",
    "uvicorn>=0.54.0",
]

[project.urls]
source = "https://github.com/lschmelzeisen/fastapi-typed-client"
issues = "https://github.com/lschmelzeisen/fastapi-typed-client/issues"
changelog = "https://github.com/lschmelzeisen/fastapi-typed-client/blob/main/CHANGELOG.md"

[project.scripts]
fastapi-typed-client = "fastapi_typed_client.cli:app"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
anyio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true

[tool.pyrefly]
preset = "all"
python-version = "3.14"
infer-with-first-use = false
search-path = ["src", "tests", "examples"]

[tool.pyrefly.errors]
# Disabled because they are too inconvenient to fix (e.g. we need `Any` for runtime type
# forms like response models).
explicit-any = false
implicit-bool = false
unknown-argument-type = false
unknown-variable-type = false
unused-call-result = false

[tool.ruff.format]
exclude = [
    "*.md", # Don't reformat code blocks in Markdown files.
    "examples/birthday_app_client.py", # Keep the example client as generated.
]

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "ARG", "B", "BLE", "C4", "C90", "DTZ", "E4", "E7", "E9", "ERA", "I", "INP", "F", "FAST", "FURB", "LOG", "N", "PIE", "PT", "PTH", "PYI", "RET", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "UP", "YTT"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # Allow asserts in tests.
"examples/**/*.py" = ["INP001"] # Dont require __init__.py for examples.
"examples/**/test_*.py" = ["S101"] # Allow asserts in examples tests.
"examples/birthday_app_client.py" = ["I001"] # Keep the example client as generated.

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
